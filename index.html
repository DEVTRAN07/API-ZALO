<!DOCTYPE html>
<html lang="vi" data-theme="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZaloBot · Control Deck</title>
<style>
/* ── AURORA DECK · design tokens ─────────────────────────────────── */
:root{
  --bg:#070a14; --bg2:#0b1020; --card:rgba(255,255,255,.035);
  --card-h:rgba(255,255,255,.06); --line:rgba(255,255,255,.09);
  --tx:#e8ecf8; --tx2:#9aa6c4; --tx3:#5f6b8a;
  --az:#4d8cff; --vi:#9b6cff; --cy:#38e1d0; --gr:#3ddc84;
  --am:#ffb43d; --rd:#ff5c72;
  --r:16px; --r2:11px; --sh:0 18px 50px -22px rgba(0,0,0,.9);
  --ff:'Inter',-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --fm:'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,monospace;
}
[data-theme="day"]{
  --bg:#f4f6fc; --bg2:#ffffff; --card:#ffffff; --card-h:#ffffff;
  --line:rgba(16,24,48,.11); --tx:#111a33; --tx2:#5a6483; --tx3:#8b94ad;
  --sh:0 14px 40px -24px rgba(16,24,48,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 620px at 88% -12%,rgba(155,108,255,.18),transparent 60%),
    radial-gradient(900px 520px at 8% 108%,rgba(56,225,208,.13),transparent 60%),
    var(--bg);
  color:var(--tx);font-family:var(--ff);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--az);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(140,155,200,.28);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ── LOGIN ───────────────────────────────────────────────────────── */
#login{position:fixed;inset:0;display:grid;place-items:center;z-index:60;
  background:radial-gradient(800px 500px at 50% 0%,rgba(77,140,255,.16),transparent 65%),var(--bg)}
.box{width:min(400px,92vw);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:22px;padding:32px 28px;box-shadow:var(--sh)}
.mark{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:24px;
  background:linear-gradient(135deg,var(--az),var(--vi));box-shadow:0 10px 30px -10px var(--az)}
.box h1{font-size:20px;margin:16px 0 4px;letter-spacing:-.3px}
.box p{color:var(--tx2);font-size:13px;margin-bottom:20px}
label.f{display:block;font-size:11.5px;color:var(--tx3);text-transform:uppercase;
  letter-spacing:.09em;margin:14px 0 6px;font-weight:600}
input.i,select.i,textarea.i{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);
  border-radius:var(--r2);padding:11px 13px;transition:.16s;outline:0}
[data-theme="day"] input.i,[data-theme="day"] select.i{background:#fff;border-color:rgba(16,24,48,.16)}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--az);
  box-shadow:0 0 0 3px rgba(77,140,255,.22);background:rgba(0,0,0,.4)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r2);
  background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;transition:.16s}
.btn:hover{background:var(--card-h);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.pri{background:linear-gradient(135deg,var(--az),var(--vi));border-color:transparent;color:#fff;
  box-shadow:0 12px 26px -14px var(--az)}
.btn.dgr{color:var(--rd);border-color:rgba(255,92,114,.35)}
.btn.ok{color:var(--gr);border-color:rgba(61,220,132,.35)}
.btn.full{width:100%;justify-content:center;padding:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.err{color:var(--rd);font-size:12.5px;margin-top:12px;min-height:17px}

/* ── SHELL ───────────────────────────────────────────────────────── */
#app{display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:242px 1fr}
aside{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:5px;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px;margin-bottom:8px;
  border-bottom:1px solid var(--line)}
.brand .mark{width:34px;height:34px;border-radius:10px;font-size:16px}
.brand b{font-size:14.5px;letter-spacing:-.2px}
.brand small{display:block;color:var(--tx3);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1}
.nv{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:var(--tx2);
  font-weight:550;font-size:13.2px;transition:.15s;text-align:left;width:100%}
.nv:hover{background:var(--card);color:var(--tx)}
.nv.on{background:linear-gradient(135deg,rgba(77,140,255,.22),rgba(155,108,255,.16));color:var(--tx);
  box-shadow:inset 2px 0 0 var(--az)}
.nv .ic{width:19px;text-align:center;font-size:14.5px}
.nv .bdg{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.09);
  color:var(--tx2);font-family:var(--fm)}
.nv .bdg.w{background:rgba(255,180,61,.2);color:var(--am)}
.nv .bdg.d{background:rgba(255,92,114,.2);color:var(--rd)}
.foot{padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--tx3)}
.who{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.who .av{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--vi),var(--az));
  display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
main{padding:22px 26px 60px;max-width:1500px}

/* ── TOPBAR ──────────────────────────────────────────────────────── */
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h2{font-size:21px;letter-spacing:-.4px;font-weight:650}
.top .sub{color:var(--tx3);font-size:12.5px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;
  background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--tx3)}
.dot.g{background:var(--gr);box-shadow:0 0 9px var(--gr)}
.dot.r{background:var(--rd);box-shadow:0 0 9px var(--rd)}
.dot.a{background:var(--am)}

/* ── CARDS ───────────────────────────────────────────────────────── */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px 18px;
  backdrop-filter:blur(9px);box-shadow:var(--sh)}
.card h3{font-size:12.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.09em;
  font-weight:650;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.stat{font-size:27px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.stat small{font-size:13px;color:var(--tx3);font-weight:500;letter-spacing:0}
.hint{color:var(--tx3);font-size:11.8px;margin-top:5px}
.bar{height:7px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:11px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--az),var(--cy))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:var(--r2);padding:13px}
.tile .k{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.tile .v{font-size:19px;font-weight:680;margin-top:3px;font-variant-numeric:tabular-nums}

/* ── TABLE ───────────────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.8px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;
  padding:7px 9px;border-bottom:1px solid var(--line);font-weight:650;white-space:nowrap}
td{padding:9px;border-bottom:1px solid rgba(255,255,255,.045);font-size:13px;vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.022)}
.mono{font-family:var(--fm);font-size:12.3px}
.num{font-variant-numeric:tabular-nums;text-align:right;font-family:var(--fm)}
.tag{display:inline-block;padding:2px 8px;border-radius:7px;font-size:11px;font-weight:650;
  background:rgba(255,255,255,.08);color:var(--tx2)}
/* công tắc bật/tắt lệnh — thay cho checkbox cũ */
.swt{position:relative;width:44px;height:24px;border-radius:99px;flex:none;
  background:rgba(255,255,255,.13);border:1px solid var(--line);transition:.18s}
.swt i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  transition:.18s;box-shadow:0 2px 7px rgba(0,0,0,.45)}
.swt.on{background:linear-gradient(135deg,var(--gr),var(--cy));border-color:transparent}
.swt.on i{left:23px}
.tag.g{background:rgba(61,220,132,.16);color:var(--gr)}
.tag.a{background:rgba(255,180,61,.16);color:var(--am)}
.tag.r{background:rgba(255,92,114,.16);color:var(--rd)}
.tag.b{background:rgba(77,140,255,.16);color:var(--az)}
/* tag của bảng Lệnh: mỗi loại một màu để nhìn là hiểu ngay.
   Trước đây dòng nào cũng bị dán nhãn đỏ "user" — nhìn như lệnh lỗi. */
.tag.o{background:rgba(255,214,102,.18);color:#ffd666}
.tag.m{background:rgba(155,108,255,.18);color:#b18cff}
.tag.n{background:rgba(255,255,255,.08);color:var(--tx3)}
.alert{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:var(--r2);
  border:1px solid rgba(255,180,61,.32);background:rgba(255,180,61,.09);margin-bottom:14px;font-size:13px}
.alert.r{border-color:rgba(255,92,114,.35);background:rgba(255,92,114,.09)}
.alert b{display:block;margin-bottom:2px}

/* ── THEME GALLERY ───────────────────────────────────────────────── */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.th{background:rgba(0,0,0,.24);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  transition:.16s;text-align:left}
.th:hover{border-color:var(--az);transform:translateY(-2px)}
.th.on{border-color:var(--vi);box-shadow:0 0 0 2px rgba(155,108,255,.3)}
.th img{width:100%;height:96px;object-fit:cover;display:block;background:#0a0f1e}
.th .nm{padding:8px 10px;font-size:12.4px;font-weight:650;display:flex;justify-content:space-between;
  align-items:center;gap:6px}
.sw{width:9px;height:9px;border-radius:50%;flex:none}
/* ── MOBILE: thanh tác vụ dưới màn hình (kiểu app Zalo) ──────────
   Trên điện thoại, sidebar bị giấu sau nút ☰. Thanh này cho truy cập
   1 chạm: Trang chủ · Lệnh · Bot con · Log · Hệ thống.
   Quy tắc gốc đứng TRƯỚC media query để không đè mất (bài học #burger). */
.mtab{display:none}
@media(max-width:900px){
  .mtab{display:flex;flex-direction:row;align-items:center;justify-content:space-between;
    gap:2px;overflow:visible;
    position:fixed;left:10px;right:10px;bottom:10px;z-index:60;
    background:rgba(26,26,30,.97);border:1px solid var(--line);
    border-radius:27px;padding:7px 9px;box-shadow:0 12px 34px rgba(0,0,0,.5);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
  .mbtn{flex:1;display:flex;align-items:center;justify-content:center;position:relative;
    background:none;border:0;color:var(--tx3);padding:7px 0;border-radius:19px;
    cursor:pointer;transition:.15s}
  .mbtn svg{width:24px;height:24px;display:block}
  .mbtn.on{color:#fff;background:rgba(255,255,255,.12)}
  .mbdg{position:absolute;top:-1px;right:calc(50% - 26px);min-width:18px;height:18px;
    border-radius:9px;background:#ff4157;color:#fff;font-size:10.5px;font-weight:800;
    display:none;place-items:center;padding:0 4px;line-height:1}
  .mbdg.on{display:grid}
}

/* ── BOT CON: card từng bot (kiểu ảnh người dùng gửi) ──────────── */
.botcard{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);
  border-radius:14px;background:rgba(255,255,255,.022);margin-bottom:10px}
.botcard:hover{border-color:rgba(77,140,255,.35);background:rgba(77,140,255,.05)}
.bav{width:46px;height:46px;border-radius:50%;flex:0 0 46px;display:grid;place-items:center;
  font-weight:800;font-size:17px;color:#12182b;
  background:linear-gradient(135deg,#7ee0ff,#8fb0ff 55%,#c39bff)}
.bav.main{background:linear-gradient(135deg,#ffe08a,#ffb763 60%,#ff8ac2);font-size:20px}
/* Avatar thật: phủ kín vòng tròn, nền gradient chỉ hiện khi ảnh hỏng/lỗi */
.bav img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;
  background:linear-gradient(135deg,#ffe08a,#ffb763 60%,#ff8ac2)}
.bmain{flex:1;min-width:0}
.bhead{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.bn{font-size:15px;font-weight:800}
.bmeta{display:flex;gap:14px;flex-wrap:wrap;margin-top:5px;font-size:12.4px;color:var(--tx2)}
.bacts{display:flex;align-items:center;gap:6px;flex:0 0 auto}

/* ── LOG ─────────────────────────────────────────────────────────── */
.log{background:#05080f;border:1px solid var(--line);border-radius:var(--r2);padding:12px;
  height:min(58vh,520px);overflow-y:auto;font-family:var(--fm);font-size:12.2px;line-height:1.65}
.ln{display:flex;gap:9px;padding:1.5px 0;border-bottom:1px solid rgba(255,255,255,.028)}
.ln .t{color:var(--tx3);flex:none}
.ln .l{flex:none;font-weight:700;width:52px}
.ln.ok .l{color:var(--gr)} .ln.err .l{color:var(--rd)} .ln.warn .l{color:var(--am)}
.ln.info .l{color:var(--az)} .ln .m{word-break:break-word}

/* ── TERMINAL ────────────────────────────────────────────────────── */
.term{background:#04060c;border:1px solid var(--line);border-radius:var(--r2);padding:12px;
  height:min(52vh,460px);overflow:auto;font-family:var(--fm);font-size:12.2px;
  line-height:1.55;white-space:pre-wrap;word-break:break-word}
.term .cmd{color:#7fd1ff;font-weight:600}
.term .ok{color:var(--gr)} .term .bad{color:var(--rd)} .term .dim{color:var(--tx3)}
.term-in{display:flex;gap:8px;align-items:center;margin-top:10px}
.term-in .pmt{color:var(--gr);font-family:var(--fm);flex:none;font-weight:700}

/* ── MISC ────────────────────────────────────────────────────────── */
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.1),rgba(255,255,255,.05));
  background-size:220% 100%;animation:sh 1.25s infinite;border-radius:8px;height:15px}
@keyframes sh{0%{background-position:120% 0}100%{background-position:-120% 0}}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:9px;z-index:80}
.tst{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--az);
  padding:11px 15px;border-radius:10px;box-shadow:var(--sh);font-size:13px;animation:in .22s;max-width:330px}
.tst.g{border-left-color:var(--gr)} .tst.r{border-left-color:var(--rd)} .tst.a{border-left-color:var(--am)}
@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
#mdl{position:fixed;inset:0;background:rgba(3,6,14,.72);backdrop-filter:blur(5px);z-index:75;
  display:none;place-items:center;padding:20px}
#mdl.on{display:grid}
.mbox{width:min(560px,94vw);background:var(--bg2);border:1px solid var(--line);border-radius:16px;
  padding:20px 22px;box-shadow:var(--sh);animation:in .18s}
.mbox h3{font-size:15px;margin-bottom:12px;text-transform:none;letter-spacing:0;color:var(--tx)}
#pal{position:fixed;inset:0;background:rgba(3,6,14,.72);backdrop-filter:blur(5px);z-index:70;
  display:none;place-items:start center;padding-top:15vh}
#pal.on{display:grid}
.pbox{width:min(560px,92vw);background:var(--bg2);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;box-shadow:var(--sh)}
.pbox input{width:100%;border:0;background:transparent;padding:16px 18px;font-size:15px;outline:0;
  border-bottom:1px solid var(--line)}
.plist{max-height:330px;overflow-y:auto;padding:7px}
.pi{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:9px;cursor:pointer}
.pi.sel{background:rgba(77,140,255,.16)}
.pi .ic{width:20px;text-align:center}
.pi .ds{margin-left:auto;color:var(--tx3);font-size:11.5px}
/* ── MOBILE (điện thoại) ────────────────────────────────────────────
   Trước đây panel chỉ có ngăn kéo sidebar; phần nội dung vẫn 2–4 cột
   nên trên máy 360–430px thì bảng tràn ngang, nút bấm chật, khó dùng.
   Khối này lo phần đó: một cột, bảng cuộn ngang, nút dễ bấm. */
@media(max-width:700px){
  .grid{gap:11px}
  .g2{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(126px,1fr))}
  .card{padding:13px 13px}
  .stat{font-size:23px}
  main{padding:12px 11px 100px}
  h1{font-size:17px}
  .row{gap:8px;flex-wrap:wrap}
  .btn{padding:9px 12px;font-size:12.5px}
  .btn.full{width:100%;justify-content:center}
  /* bảng dài → cuộn ngang trong khung riêng, không phá layout */
  .card table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
  #pal{padding-top:8vh}
  .pbox{width:94vw}
  .pi .ds{display:none}
  .plist{max-height:56vh}
  input.i,select.i,textarea.i{font-size:16px}  /* iOS không zoom khi focus */
}
@media(max-width:900px){
  #app.on{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;width:250px;z-index:50;transform:translateX(-105%);transition:.22s;
    background:var(--bg2)}
  aside.open{transform:none}
  main{padding:16px 14px 100px}
  #toast{bottom:96px}
}
/* Thứ tự QUAN TRỌNG: luật gốc phải đứng TRƯỚC media query.
   Trước đây `#burger{display:none}` đứng sau nên đè luôn media query
   → trên điện thoại KHÔNG có nút nào mở sidebar, panel như bị khoá. */
#burger{display:none}
@media(max-width:900px){#burger{display:inline-flex}}
/* Mục lệnh (details.catsec): tiêu đề to, dễ bấm, có mũi tên mở/đóng.
   Dùng <details> gốc của trình duyệt nên không cần JS để thu/mở. */
details.catsec{padding:14px 16px}
details.catsec>summary{list-style:none;display:flex;align-items:center;gap:10px;
  font-size:14.5px;color:var(--tx)}
details.catsec>summary::-webkit-details-marker{display:none}
details.catsec>summary::before{content:'▸';color:var(--tx3);transition:.15s}
details.catsec[open]>summary::before{transform:rotate(90deg)}
details.catsec>summary .tag{margin-left:auto}
</style>

<!-- panel_export: địa chỉ bot nhúng sẵn (người dùng đổi được ngay
     trên trang đăng nhập; lựa chọn của họ luôn được ưu tiên hơn). -->
<script>window.__ZB_API__ = "";</script>
</head>
<body>

<!-- ══ LOGIN ══════════════════════════════════════════════════════ -->
<div id="login">
  <form class="box" id="lform">
    <div class="mark">⌘</div>
    <h1>ZaloBot Control Deck</h1>
    <p>Bảng điều khiển v4 · đăng nhập để tiếp tục</p>
    <label class="f" for="u">Tài khoản</label>
    <input id="u" class="i" autocomplete="username" placeholder="admin">
    <label class="f" for="p">Mật khẩu</label>

<script>
'use strict';
/* ────────────────────────────────────────────────────────────────────
   ZaloBot Control Deck v4 — SPA một file.
   Gọi MỘT API /api/v4/overview cho cả dashboard (nhanh hơn nhiều so
   với 8–10 request của bản cũ). Mọi hành động khác dùng API sẵn có.
   Chạy được cả ở origin khác: panel được host TĨNH trên GitHub Pages
   (https://devtran07.github.io/API-ZALO/) rồi trỏ về bot đang chạy trong nhà
   qua ?api=http://… (link QR do lệnh ⌘web qr gửi vào Zalo đã kèm sẵn).
   Khi đó mọi request đi tới địa chỉ đó và trình duyệt phải qua được CORS.
   Đăng nhập chỉ cần TÀI KHOẢN + MẬT KHẨU: địa chỉ bot tự suy ra từ ?api=…,
   cùng origin, hoặc tự dò bot_address.json trên kho dữ liệu (raw).
   Token: luôn nằm ở localStorage (phiên hạn 30 ngày, tự gia hạn) — panel
   để chạy 24/7 nên mở lại tab là vào ngay.
   ──────────────────────────────────────────────────────────────────── */
const S = {
  apiBase: '',            // địa chỉ bot (rỗng = cùng origin với panel)
  remember: false,        // token nằm ở localStorage (thiết bị này vào thẳng)
  token: localStorage.getItem('zbt') || sessionStorage.getItem('zbt') || '',
  role:  localStorage.getItem('zbr') || sessionStorage.getItem('zbr') || '',
  user:  localStorage.getItem('zbu') || sessionStorage.getItem('zbu') || '',
  view:  'dash',
  ov:    null,
  cmdList: null,        // /api/commands — dùng cho badge “lệnh mới”
  newCmds: null,        // số lệnh vừa thêm (cmd() khai báo "new": true)
  history: [],          // mẫu RTT/độ trễ để vẽ sparkline
  timer: null,
  logSrc: null,
  logRetry: 0,        // số lần thử lại luồng log (backoff khi mất kết nối)
  queued: [],
  noise: [],
  data: null,           // /api/v4/data/status — kho ảnh dựng sẵn (API-ZALO)
};
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('vi-VN');
const ms  = n => n == null ? '—' : (n < 1000 ? n + ' ms' : (n/1000).toFixed(2) + ' s');
const bsize = n => {                       // dung lượng kiểu người đọc được
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(0) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
};

/* ── Địa chỉ bot (để panel host tĩnh ở nơi khác vẫn điều khiển được) ── */
function setApiBase(v, save = true) {
  S.apiBase = String(v || '').trim().replace(/\/+$/, '');
  if (save) {
    try {
      // Lưu dạng JSON để phân biệt "chưa từng chọn" (null) với "chọn dùng
      // cùng máy" (chuỗi rỗng). Nếu lưu rỗng đơn thuần thì địa chỉ mặc định
      // của bản host tĩnh sẽ ghi đè lựa chọn đó ở lần mở sau.
      localStorage.setItem('zb_api', JSON.stringify({ v: S.apiBase }));
    } catch (e) {}
  }
  return S.apiBase;
}
function apiUrl(path) {
  if (!S.apiBase || /^https?:/i.test(path)) return path;
  return S.apiBase + (path.startsWith('/') ? path : '/' + path);
}
function savedApiBase() {
  try {
    const raw = localStorage.getItem('zb_api');
    if (raw == null) return null;           // chưa chọn → dùng mặc định bản host
    const d = JSON.parse(raw);
    return String((d && d.v) || '');
  } catch (e) { return null; }
}
(function initApiBase() {
  try {
    const q = new URLSearchParams(location.search).get('api');
    if (q) { setApiBase(q); return; }        // ?api=… → nhớ luôn cho lần sau
    const s = savedApiBase();
    // Bản host tĩnh có thể nhúng sẵn địa chỉ bot (window.__ZB_API__) để mở lên
    // là dùng được ngay, nhưng KHÔNG được đè lên lựa chọn của người dùng.
    S.apiBase = (s != null) ? s : String(window.__ZB_API__ || '').trim();
    // Trang https KHÔNG gọi được api http (mixed content) — địa chỉ http cũ
    // còn nhớ trong máy chỉ gây chặn đăng nhập: bỏ đi để tự dò qua raw.
    if (S.apiBase && apiBlocked(S.apiBase)) {
      try { localStorage.removeItem('zb_api'); } catch (e) {}
      S.apiBase = '';
    }
  } catch (e) { S.apiBase = ''; }
})();

/* Nhớ (hoặc quên) phiên: localStorage = mở lại tab vẫn vào; sessionStorage = hết phiên khi đóng tab. */
function storeSession(remember) {
  const st = remember ? localStorage : sessionStorage;
  const other = remember ? sessionStorage : localStorage;
  try {
    ['zbt','zbr','zbu'].forEach(k => other.removeItem(k));
    st.setItem('zbt', S.token);
    st.setItem('zbr', S.role);
    st.setItem('zbu', S.user);
  } catch (e) {}
  S.remember = !!remember;
}

/* Trang https KHÔNG gọi được API http (mixed content) — trừ localhost.
   Đây là lý do THẬT khiến panel ở GitHub Pages không đăng nhập được:
   Chrome chặn thẳng request tới http://192.168.x.x:5000. Nói rõ ra thay vì
   để người dùng đoán "panel hỏng". */
function apiBlocked(url) {
  const v = String(url != null ? url : (S.apiBase || ''));
  if (location.protocol !== 'https:') return false;   // cùng http → không chặn
  if (!/^http:\/\//i.test(v)) return false;           // https hoặc cùng origin
  const host = v.slice(7).split('/')[0].split(':')[0].toLowerCase();
  return !['localhost', '127.0.0.1', '::1', '[::1]'].includes(host);
}

/* ── Kho dữ liệu dựng sẵn (repo API-ZALO) ───────────────────────── */
async function dataStatus(force) {
  if (S.data && !force) return S.data;
  S.data = await api('/api/v4/data/status');
  return S.data;
}
async function pullData() {
  const b = $('#pullBtn'); if (b) { b.disabled = true; b.textContent = '⏳ đang kéo…'; }
  try {
    const d = await api('/api/v4/data/pull', { method: 'POST' });
    toast(d.running ? '⏳ Đang kéo — thử lại sau' : '⬇️ Đang kéo dữ liệu về máy…', 'ok');
  } catch (e) {
    toast('🔴 ' + e.message, 'err');
  }
  // Chờ vài nhịp rồi làm mới số liệu trên card
  setTimeout(async () => {
    try { await dataStatus(true); } catch (e) {}
    draw();
  }, 4000);
}

function toast(msg, kind='') {
  const el = document.createElement('div');
  el.className = 'tst ' + kind;
  el.innerHTML = esc(msg);
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

/* ── HTTP ───────────────────────────────────────────────────────── */
async function api(path, opt={}) {
  const t0 = performance.now();
  const o = { method: opt.method || 'GET', headers: {} };
  if (S.token) o.headers['X-Panel-Token'] = S.token;
  if (opt.body !== undefined) {
    o.headers['Content-Type'] = 'application/json';
    o.body = JSON.stringify(opt.body);
  }
  let r, d;
  try {
    r = await fetch(apiUrl(path), o);
  } catch (e) {
    rtt(null, false);
    throw new Error('Không kết nối được tới bot');
  }
  try { d = await r.json(); } catch (e) { d = {}; }
  if (path === '/api/v4/ping') rtt(performance.now() - t0, r.ok);
  if (r.status === 401) { logout(true); throw new Error('Phiên đăng nhập đã hết'); }
  if (!r.ok || d.ok === false) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}
function rtt(v, ok) {
  const el = $('#rtt');
  if (v == null) { el.innerHTML = '<span class="dot a"></span> mất kết nối'; return; }
  const cls = v < 120 ? 'g' : v < 500 ? 'a' : 'r';
  el.innerHTML = `<span class="dot ${cls}"></span> ${Math.round(v)} ms`;
  S.history.push({ t: Date.now(), v: Math.round(v), ok: !!ok });
  if (S.history.length > 90) S.history.shift();
}

/* ── AUTH ───────────────────────────────────────────────────────── */
/* Panel Pages TRẦN (không ?api=) vẫn phải vào được chỉ bằng tk/mk: khi
   chưa biết địa chỉ bot, panel tự dò `data/bot_address.json` trên kho dữ
   liệu API-ZALO (bot ghim địa chỉ https là bot tự công bố lên đó). */
async function discoverBot() {
  try {
    const r = await fetch('https://raw.githubusercontent.com/DEVTRAN07/API-ZALO/main/data/bot_address.json',
      { cache: 'no-store' });
    if (!r.ok) return '';
    const j = await r.json();
    const u = String((j && j.url) || '').trim();
    if (!/^https:\/\//i.test(u)) return '';       // http sẽ bị chặn — đừng đeo vào
    setApiBase(u);
    return u;
  } catch (e) { return ''; }
}

/* ── Trạng thái sống của bot ngay trên trang đăng nhập ──────────────── */
/* Bot đẩy `bot_status.json` lên kho dữ liệu mỗi 15 phút (heartbeat);
   panel đọc qua raw: tươi <45 phút = đang chạy, cũ hơn = mất tín hiệu.
   Fetch lỗi → để trống, không làm người dùng hoang mang. */
const HEART_URL = 'https://raw.githubusercontent.com/DEVTRAN07/API-ZALO/main/data/bot_status.json';
const HEART_FRESH = 2700;   // 45 phút — gấp 3 nhịp heartbeat
function fmtAgo(s) {
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + ' giây';
  if (s < 3600) return Math.round(s / 60) + ' phút';
  return Math.round(s / 3600) + ' giờ';
}
async function checkBotHeart() {
  const el = $('#lstat');
  if (!el) return;
  try {
    const r = await fetch(HEART_URL + '?_=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) { el.innerHTML = ''; return; }
    const j = await r.json().catch(() => null);
    if (!j || !j.ts) { el.innerHTML = ''; return; }
    const age = Date.now() / 1000 - j.ts;
    el.innerHTML = age < HEART_FRESH
      ? '🟢 Bot đang chạy <span style="opacity:.6">— tín hiệu '
        + fmtAgo(age) + ' trước</span>'
      : '🔴 Bot mất tín hiệu ' + fmtAgo(age) + ' trước — có thể đã tắt';
  } catch (e) { el.innerHTML = ''; }
}
$('#lform').addEventListener('submit', e => { e.preventDefault(); attemptLogin(false); });
async function attemptLogin(isRetry) {
  const b = $('#lbtn'); b.disabled = true; $('#lerr').textContent = '';
  try {
    const d = await api('/api/login', { method: 'POST', body: { username: $('#u').value, password: $('#p').value } });
    if (!d.token) throw new Error('Máy chủ không trả token');
    S.token = d.token; S.role = d.role || 'admin';
    S.user = d.username || $('#u').value || 'admin';
    // Panel để chạy 24/7: luôn nhớ phiên (token hạn 30 ngày, tự gia hạn khi
    // dùng). Không còn ô "Nhớ thiết bị" — mặc định nhớ để mở lại tab là vào ngay.
    storeSession(true);
    start();
  } catch (err) {
    // Lỗi MẠNG (không phải sai mật khẩu) → tự dò địa chỉ bot qua kho dữ liệu
    // và thử lại ĐÚNG MỘT lần — kể cả khi đang nhớ một địa chỉ cũ/không dùng
    // được (http bị chặn mixed content, LAN từ xa…).
    const net = !/Sai tài khoản|mật khẩu|Phiên đăng nhập|quyền|local_only/i.test(err.message);
    if (net && !isRetry) {
      if (await discoverBot()) { b.disabled = false; return attemptLogin(true); }
      if (apiBlocked()) {
        $('#lerr').innerHTML = 'Trình duyệt CHẶN trang https gọi API http '
          + '(mixed content): <span class="mono">' + esc(S.apiBase || '(rỗng)') + '</span>.'
          + ' Hãy mở panel ngay trên máy chạy bot, hoặc dùng địa chỉ bot https.';
      } else {
        $('#lerr').textContent =
          'Không vào được bot — bot đang tắt hoặc chưa ghim địa chỉ https.';
      }
    } else {
      $('#lerr').textContent = err.message;
    }
    if (net) checkBotHeart();   // bot không phản hồi → cập nhật 🟢/🔴 lên trang
  }
  b.disabled = false;
}
$('#out').addEventListener('click', () => logout());
function logout(silent) {
  if (S.token) api('/api/logout', { method: 'POST', body: { token: S.token } }).catch(() => {});
  ['zbt','zbr','zbu'].forEach(k => {
    try { sessionStorage.removeItem(k); localStorage.removeItem(k); } catch (e) {}
  });
  S.token = ''; S.role = ''; S.remember = false;
  if (S.timer) clearInterval(S.timer);
  if (S.logSrc) { S.logSrc.close(); S.logSrc = null; }
  $('#app').classList.remove('on'); $('#login').style.display = 'grid';
  if (!silent) toast('Đã đăng xuất');
}

/* ── NAV ────────────────────────────────────────────────────────── */

function renderNav() {

    `<button class="nv" data-v="${k}" title="${esc(d)}"><span class="ic">${i}</span>${n}` +

  $$('#nav .nv[data-v]').forEach(b => b.onclick = () => go(b.dataset.v));

}
function go(v) {
  // Rời tab Log thì đóng luồng SSE: giữ nó chỉ tốn kết nối (trang này có thể
  // mở 24/7) mà log nhận được cũng không có chỗ hiển thị.
  if (v !== 'log' && S.logSrc) {
    try { S.logSrc.close(); } catch (e) {}
    S.logSrc = null;
  }
  S.view = v;
  $$('#nav .nv').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  const n = NAV.find(x => x[0] === v) || NAV[0];
  $('#ttl').textContent = n[2]; $('#sub').textContent = n[3];
  $('#side').classList.remove('open');
  location.hash = '#/' + v;
  setMtab(v);
  draw();
}

/* ── MOBILE: thanh tác vụ 6 mục (kiểu app Zalo trong ảnh) ────────────

const MNAV = [

/* ── CHARTS (SVG thuần, không thư viện) ─────────────────────────── */
function spark(pts, w=520, h=54) {
  if (!pts.length) return '<div class="hint">Chưa có mẫu đo nào — để panel chạy vài giây.</div>';
  const mx = Math.max(...pts.map(p => p.v), 1);
  const step = pts.length > 1 ? w / (pts.length - 1) : w;
  const path = pts.map((p,i) => `${i?'L':'M'}${(i*step).toFixed(1)},${(h - p.v/mx*(h-8) - 4).toFixed(1)}`).join(' ');
  const area = `${path} L${((pts.length-1)*step).toFixed(1)},${h} L0,${h} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px">
    <defs><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d8cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#4d8cff" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#gp)"/><path d="${path}" fill="none" stroke="#4d8cff" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
  </svg><div class="hint">Đỉnh ${num(mx)} ms · ${pts.length} mẫu gần nhất</div>`;
}
function donut(segs, size=132) {
  const total = segs.reduce((a,s) => a + s.v, 0) || 1;
  const R = 52, C = 2*Math.PI*R;
  let off = 0;
  const arcs = segs.map(s => {
    const len = s.v/total*C, el =
      `<circle cx="66" cy="66" r="${R}" fill="none" stroke="${s.c}" stroke-width="15"
        stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}"
        stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 66 66)"/>`;
    off += len; return el;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 132 132">
    <circle cx="66" cy="66" r="${R}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="15"/>
    ${arcs}
    <text x="66" y="62" text-anchor="middle" fill="currentColor" font-size="21" font-weight="700">
      ${total.toFixed(1)}</text>
    <text x="66" y="80" text-anchor="middle" fill="var(--tx3)" font-size="11">MB</text></svg>`;
}

/* Màu theo LOẠI tag do server gửi lên (xem /api/commands → tags).
   Sửa lỗi cũ: JS tự đoán `role!=='member'` nên mọi lệnh đều bị dán tag đỏ. */
const TAG_CLS = { owner:'o', admin:'r', mod:'m', ack:'a', sess:'b', group:'a', any:'n' };
function tagChips(x) {
  const tags = x.tags || [];
  if (!tags.length) return '<span class="hint">— chưa có tag —</span>';
  return tags.map(t =>
    `<span class="tag ${TAG_CLS[t.k] || 'n'}" title="${esc(t.t)}">${esc(t.t)}</span>`
  ).join(' ');
}
function rowCmd(x) {
  // Hiện ĐÚNG cách gõ lệnh: prefix + tên (bot có thể đổi prefix bất cứ lúc nào)
  const pfx = (S.ov?.bot?.prefix) || '⌘';
  const cat = x.category_label || x.category || '📦 Chung';
  const hay = (x.name + ' ' + (x.description||'') + ' ' +
               (x.aliases||[]).join(' ') + ' ' +
               (x.tags||[]).map(t => t.t).join(' ')).toLowerCase();
  return `<tr data-n="${esc(hay)}" data-cat="${esc(cat)}" data-cmd="${esc(x.name)}">
    <td><b class="mono">${esc(pfx + x.name)}</b>${x.new?' <span class="tag b">mới</span>':''}${x.aliases?.length?`<br><span class="hint">${esc(pfx)}${esc(x.aliases.join(' · ' + pfx))}</span>`:''}</td>
    <td>${tagChips(x)}</td>
    <td style="color:var(--tx2);font-size:12.5px">${esc(x.description||'')}</td>
    <td><button class="swt ${x.enabled?'on':''}" role="switch"
      aria-checked="${x.enabled?'true':'false'}" title="Bật/tắt ${esc(pfx+x.name)}"
      onclick="toggleCmd('${esc(x.name)}', this)"><i></i></button></td></tr>`;
}
function filterCmds(q) {
  // Tìm trong MỌI mục: giấu dòng không khớp để số đang bật / tổng vẫn đúng
  const s = (q||'').toLowerCase().trim();
  document.querySelectorAll('.catsec').forEach(sec => {
    let vis = 0;
    sec.querySelectorAll('tbody tr').forEach(tr => {
      const ok = !s || tr.dataset.n.includes(s) ||
                 sec.dataset.cat.toLowerCase().includes(s);
      tr.style.display = ok ? '' : 'none';
      if (ok) vis++;
    });
    sec.style.display = vis ? '' : 'none';
    if (s && vis) sec.open = true;   // tự mở mục có kết quả
  });
}
function _cmdRowsOf(cat) {
  const sec = [...document.querySelectorAll('.catsec')]
    .find(s => s.dataset.cat === cat);
  return sec ? [...sec.querySelectorAll('tbody tr')] : [];
}

async function toggleCat(cat, on, ev) {
  if (ev && ev.preventDefault) ev.preventDefault();
  await _applyToggle(_cmdRowsOf(cat), on);
  toast(`${cat}: đã ${on ? 'bật' : 'tắt'} ${_cmdRowsOf(cat).length} lệnh`, on ? 'g' : '');
}

async function toggleAllCats(on) {
  const rows = [...document.querySelectorAll('.catsec tbody tr')];
  await _applyToggle(rows, on);
  toast(`Toàn bộ ${rows.length} lệnh: đã ${on ? 'bật' : 'tắt'}`, on ? 'g' : '');
}

async function _applyToggle(rows, on) {
  // Bật/tắt tuần tự qua ĐÚNG endpoint mà công tắc lẻ dùng — không có
  // đường riêng nào để hai bên lệch trạng thái.
  for (const tr of rows) {
    const sw = tr.querySelector('.swt');
    if (!sw || sw.classList.contains('on') === on) continue;
    try {
      await api('/api/commands/toggle',
        { method: 'POST', body: { name: tr.dataset.cmd, enabled: on } });
      sw.classList.toggle('on', on);
      sw.setAttribute('aria-checked', on ? 'true' : 'false');
      tr.closest('.catsec').querySelector('summary .tag').textContent = _catCount(tr.closest('.catsec'));
    } catch (e) { toast(`${tr.dataset.cmd}: ${e.message}`, 'r'); }
  }
}

function _catCount(sec) {
  const all = [...sec.querySelectorAll('tbody tr')];
  return `${all.filter(r => r.querySelector('.swt')?.classList.contains('on')).length}/${all.length} bật`;
}

function fmtUp(sec) {
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600),
        m = Math.floor((sec % 3600) / 60);
  return d ? `${d}d ${h}h ${m}m` : (h ? `${h}h ${m}m` : `${m}m`);
}
/* Một bot = một card: avatar + tên + nhãn + số liệu sống + nút vòng đời.

        <span title="Thời gian đang chạy">⏱ <b>${fmtUp(up)}</b></span>
        <span title="Tin nhắn đã xử lý">💬 ${num(b.msgs_today || 0)}
          <span class="hint">hôm nay</span></span>
        <span title="Số nhóm bot đang ở">🏠 ${num(b.groups || 0)} nhóm</span>
        <span title="Người đã tương tác">👥 ${num(b.users || 0)}</span>

          onclick="reloginModal('${esc(b.name)}')">📱</button>

        <button class="btn dgr" title="Xoá vĩnh viễn" onclick="delBot('${esc(b.name)}')">🗑</button>`}
    </div></div>`;
}
V.mybot = async () => {

async function ttlSave() {
  const on = $('#ttl-on')?.checked;
  const body = { apply_all: !!on };
  const put = (sel, key) => {
    const v = parseInt($(sel)?.value || '0', 10);
    if (v > 0) body[key] = v;
  };
  put('#ttl-ti', 'tier_transient_sec');
  put('#ttl-no', 'tier_normal_sec');
  put('#ttl-lo', 'tier_long_sec');
  put('#ttl-max', 'max_ttl_sec');
  try {
    const r = await api('/api/v4/ttl', { method: 'POST', body });
    toast(r.apply_all
      ? `TTL mọi bot: chờ ${r.tier_transient_sec}s · thường ${r.tier_normal_sec}s`
        + ` · card ${r.tier_long_sec}s`
      : 'Đã tắt tự xoá tin', r.apply_all ? 'g' : 'r');
    draw();
  } catch (e) { toast(e.message, 'r'); }
}
/* Thêm bot con — 2 cách: dán imei+cookie, hoặc quét QR (không cần cookie).
   Cả 2 đều CHỜ đăng nhập thật: imei/cookie hoặc QR phải ĐÚNG mới thêm;
   sai thì server xoá slot vừa tạo và trả lỗi, panel hiện đỏ ngay tại chỗ. */
function addBotModal(mainInput) {
  const main = mainInput || { prefix: '⌘' };
  const pfx = esc(main.prefix || '⌘');
  modal('＋ Thêm bot con', `
    <div class="row" style="gap:7px;margin-bottom:12px">
      <button class="btn pri" id="nb-t-imei" onclick="addBotTab('imei')">🔑 IMEI + Cookie</button>
      <button class="btn" id="nb-t-qr" onclick="addBotTab('qr')">📱 Quét QR</button>
    </div>
    <div id="nb-pane-imei">
      <div class="hint" style="margin-bottom:10px">Dán <b>imei</b> + <b>cookie</b> của tài khoản Zalo
        dùng làm bot con. Cookie nhận cả JSON lẫn <b class="mono">secret_key</b> đơn lẻ.
        Bot chỉ được thêm khi Zalo chấp nhận đăng nhập.</div>
      <input class="i" id="nb-imei" placeholder="IMEI  (vd 45f87422-a7f3-...)"
        style="width:100%;margin-bottom:8px">
      <textarea class="i" id="nb-cookie" rows="4"
        placeholder='Cookie JSON: {"secret_key":"…", "imei":"…"}  — hoặc chỉ secret_key'
        style="width:100%;margin-bottom:8px;font-family:var(--fm)"></textarea>
      <input class="i" id="nb-prefix" placeholder="Prefix (mặc định = prefix bot chính)"
        style="width:100%" value="${pfx}">
      <div class="hint" style="margin-top:9px">Bot con chạy ở tiến trình riêng, dùng chung danh sách lệnh
        và tự xoá tin theo TTL như bot chính.</div>
      <details style="margin-top:10px">
        <summary class="hint" style="cursor:pointer;font-weight:700">
          📖 Chưa biết lấy imei / cookie? Bấm xem cách lấy</summary>
        <div class="hint" style="margin-top:7px;line-height:1.7">
          Mở Zalo Web <b class="mono">chat.zalo.me</b> trên máy tính → bấm <b>F12</b> (DevTools):<br>
          • <b>imei</b>: tab <b>Application</b> (hoặc Storage) → <b>Local Storage</b> →
            <b class="mono">chat.zalo.me</b> → tìm giá trị có dạng UUID
            (8-4-4-4-12 ký tự, thường ở khoá có tên imei/uuid).<br>
          • <b>cookie</b>: tab <b>Network</b> → bấm một request bất kỳ tới
            <b class="mono">chat.zalo.me</b> → <b>Headers</b> → <b class="mono">Cookie</b>;
            dán nguyên dòng Cookie, hoặc chỉ cần <b class="mono">secret_key=…</b>.<br>
          💡 Không muốn lấy gì cả? Chuyển tab <b>📱 Quét QR</b> ở trên — quét bằng
          app Zalo trên điện thoại là bot con được thêm ngay.
        </div>
      </details>
    </div>
    <div id="nb-pane-qr" style="display:none">
      <div class="hint" style="margin-bottom:10px;text-align:center">Không cần cookie: quét QR
        bằng app Zalo rồi xác nhận trên điện thoại — bot con được tạo ngay sau đó.</div>
      <div id="nb-qr-box" style="display:none;text-align:center">
        <img id="nb-qr-img" alt="QR đăng nhập"
          style="width:100%;max-width:270px;background:#fff;border-radius:10px;padding:8px">
      </div>
      <div class="hint" id="nb-qr-state" style="margin:9px 0;text-align:center">Bấm “Tạo QR” để bắt đầu.</div>
      <input class="i" id="nb-qr-prefix" placeholder="Prefix (mặc định = prefix bot chính)"
        style="width:100%" value="${pfx}">
    </div>`,
    'Thêm bot', () => {});
  // Nút OK dùng chung: tab IMEI = thêm bot, tab QR = tạo/tạo lại mã QR.
  $('#m-ok').onclick = () => {
    if ($('#nb-pane-qr')?.style.display !== 'none') { qrAddStart(); return; }
    addBotSubmit();
  };
}
function addBotTab(tab) {
  const qr = tab === 'qr';
  const pImei = $('#nb-pane-imei'), pQr = $('#nb-pane-qr');
  if (!pImei || !pQr) return;
  pImei.style.display = qr ? 'none' : '';
  pQr.style.display = qr ? '' : 'none';
  $('#nb-t-imei')?.classList.toggle('pri', !qr);
  $('#nb-t-qr')?.classList.toggle('pri', qr);
  const ok = $('#m-ok');
  if (ok) ok.textContent = qr ? '🔄 Tạo QR' : 'Thêm bot';
  if (qr && !S._qrSession) qrAddStart();     // mở tab là có QR luôn
}
async function addBotSubmit() {
  const imei = ($('#nb-imei')?.value || '').trim();
  const cookie = ($('#nb-cookie')?.value || '').trim();
  const prefix = ($('#nb-prefix')?.value || '').trim();
  const btn = $('#m-ok');
  if (!imei || !cookie) { toast('Thiếu imei hoặc cookie', 'r'); return; }
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Đang kiểm tra đăng nhập…'; }
  try {
    const r = await api('/api/v4/mybot/add', { method: 'POST',
      body: { imei, cookie, prefix } });
    toast(r.message || 'Đã thêm bot con', 'g');
    modalClose(); draw();
  } catch (e) {
    // imei/cookie sai → server không thêm slot; giữ form để dán lại.
    toast(e.message, 'r');
    if (btn) { btn.disabled = false; btn.textContent = 'Thêm bot'; }
  }
}
async function qrAddStart() {
  if (S._qrTimer) { clearInterval(S._qrTimer); S._qrTimer = null; }
  S._qrSession = '';
  const btn = $('#m-ok'), state = $('#nb-qr-state');
  const prefix = ($('#nb-qr-prefix')?.value || '').trim();
  const setState = t => { if (state) state.textContent = t; };
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Đang tạo QR…'; }
  setState('Đang tạo mã QR…');
  try {
    const d = await api('/api/v4/mybot/qr/start', { method: 'POST', body: { prefix } });
    S._qrSession = d.id;
    const img = $('#nb-qr-img'), box = $('#nb-qr-box');
    if (img && d.image) img.src = d.image;
    if (box) box.style.display = '';
    setState(d.message || 'Quét mã QR bằng app Zalo');
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Tạo QR mới'; }
    S._qrTimer = setInterval(qrPoll, 2000);
  } catch (e) {
    setState('❌ ' + e.message);
    toast(e.message, 'r');
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Tạo QR'; }
  }
}
async function qrPoll() {
  if (!S._qrSession) return;
  try {
    const d = await api('/api/v4/mybot/qr/status/' + encodeURIComponent(S._qrSession));
    const state = $('#nb-qr-state');
    if (state && d.message) state.textContent = d.message;
    if (d.state === 'done') {
      clearInterval(S._qrTimer); S._qrTimer = null; S._qrSession = '';
      toast(d.message || 'Đã thêm bot con ✅', 'g');
      modalClose(); draw();
    } else if (d.state === 'error') {
      clearInterval(S._qrTimer); S._qrTimer = null; S._qrSession = '';
      const btn = $('#m-ok');
      if (btn) { btn.disabled = false; btn.textContent = '🔄 Tạo QR mới'; }
      toast(d.error || 'QR thất bại', 'r');
    }
  } catch (e) {
    // 1 nhịp lỗi mạng không phá phiên QR; chỉ dừng khi phiên mất hẳn.
    if (/hết hạn|không tồn tại/i.test(e.message)) {
      clearInterval(S._qrTimer); S._qrTimer = null; S._qrSession = '';
      toast(e.message, 'r');
    }
  }
}

/* Đăng nhập LẠI bot con đã có (cookie hết hạn) — QR cấp phiên mới cho
   ĐÚNG slot cũ: giữ nguyên tên/prefix, không tạo thêm slot. Server dùng

async function qrReloginStart(name) {

    const img = $('#nb-qr-img'), box = $('#nb-qr-box');

    setState(d.message || 'Quét mã QR bằng app Zalo');

    S._qrTimer = setInterval(qrPoll, 2000);
  } catch (e) {
    setState('❌ ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Tạo QR'; }

V.log = async () => {
  setTimeout(attachLog, 30);
  return `
    <div class="card" style="margin-bottom:14px">
      <div class="row">
        <span class="pill" id="lstate"><span class="dot a"></span> đang kết nối…</span>
        <input class="i" id="lq" placeholder="Lọc theo từ khoá…" style="max-width:280px"
          oninput="logFilter(this.value)">
        <button class="btn" id="lpause" onclick="logPause()">⏸ Tạm dừng</button>
        <button class="btn" onclick="S.noise=[];$('#lbox').innerHTML=''">🗑 Xoá màn hình</button>
        <div class="spacer" style="flex:1"></div>
        <label class="row" style="gap:6px;font-size:12.5px">
          <input type="checkbox" id="lh" checked> ẩn log hệ thống</label>
      </div></div>
    <div class="log" id="lbox"><div class="hint" style="padding:8px">Đang chờ log từ bot…</div></div>`;
};
function attachLog() {
  if (S.logSrc) { S.logSrc.close(); S.logSrc = null; }
  const box = $('#lbox'); if (!box) return;
  S.logRetry = 0;
  openLogStream();
}
/* Log chứa nội dung tin nhắn thật nên luồng SSE phải có "vé" ngắn hạn: vé
   lấy bằng POST kèm token (EventSource không gửi được header), hết hạn thì
   xin vé mới — nhờ vậy mở panel từ xa vẫn xem được log mà người lạ không đọc lén được. */
async function openLogStream() {
  const box = $('#lbox'); if (!box) return;
  if (S.logSrc) { S.logSrc.close(); S.logSrc = null; }
  let ticket = '';
  try {
    const d = await api('/api/log/ticket', { method: 'POST' });
    ticket = d.ticket || '';
  } catch (e) {
    const s = $('#lstate');
    if (s) s.innerHTML = '<span class="dot r"></span> không mở được log';
    return;
  }
  const src = new EventSource(apiUrl('/api/log/stream?ticket=' + encodeURIComponent(ticket)));
  S.logSrc = src;
  src.onopen = () => {
    S.logRetry = 0;
    const s = $('#lstate'); if (s) s.innerHTML = '<span class="dot g"></span> trực tiếp';
  };
  src.onerror = () => {
    const s = $('#lstate');
    if (s) s.innerHTML = '<span class="dot a"></span> đang kết nối lại…';
    // Tự nối lại kèm vé mới (vé cũ có thể đã hết hạn sau 60 giây).
    src.close();
    if (S.logSrc === src) S.logSrc = null;
    const wait = Math.min(1000 * Math.pow(2, S.logRetry || 0), 30000);
    S.logRetry = Math.min((S.logRetry || 0) + 1, 5);
    setTimeout(() => { if (S.view === 'log' && !S.logSrc) openLogStream(); }, wait);
  };
  src.onmessage = e => {
    let d; try { d = JSON.parse(e.data); } catch { return; }
    if (S.paused) { S.queued.push(d); if (S.queued.length > 400) S.queued.shift(); return; }
    pushLog(d);
  };
}
function pushLog(d) {
  const lvl = (d.level || d.kind || 'info').toLowerCase();
  const q = ($('#lq')?.value || '').toLowerCase();
  const hideSys = $('#lh')?.checked;
  const msg = d.msg || d.message || d.text || JSON.stringify(d);
  if (hideSys && /^\[?(gc|system|debug)/i.test(msg)) return;
  if (q && !(msg + ' ' + lvl).toLowerCase().includes(q)) return;
  const box = $('#lbox'); if (!box) return;
  const first = box.querySelector('.hint'); if (first) first.remove();
  const el = document.createElement('div');
  el.className = 'ln ' + (/err|fail/.test(lvl) ? 'err' : /warn/.test(lvl) ? 'warn'
    : /ok|success/.test(lvl) ? 'ok' : 'info');
  el.innerHTML = `<span class="t">${esc(d.ts||'')}</span><span class="l">${esc(lvl.slice(0,6).toUpperCase())}</span>
    <span class="m">${esc(msg)}</span>`;
  box.appendChild(el);
  if (box.children.length > 500) box.firstChild.remove();
  box.scrollTop = box.scrollHeight;
}
function logFilter() { /* lọc áp dụng cho log mới; log cũ giữ nguyên để không mất dấu */ }
function logPause() {
  S.paused = !S.paused;
  const b = $('#lpause');
  if (b) b.textContent = S.paused ? '▶ Tiếp tục' : '⏸ Tạm dừng';
  if (!S.paused) { S.queued.forEach(pushLog); S.queued = []; }
}

/* ── TERMINAL ───────────────────────────────────────────────────────
   Chạy lệnh NGAY TRÊN MÁY ĐANG CHẠY BOT (git pull, pip install, restart…)
   nên không phải ngồi vào đúng máy đó nữa. Server là bên quyết định có
   cho chạy hay không (`local_only` / `allow_terminal`) — panel chỉ hiện
   đúng thứ server cho phép, không tự nới quyền. */
V.term = async () => {
  let d = {};
  try { d = await api('/api/v4/terminal'); }
  catch (e) { d = { error: e.message }; }
  S.termState = d;
  const quick = (d.quick || []).map((q, i) =>
    `<button class="btn" style="font-size:12px" onclick="termQuick(${i})">${esc(q.label)}</button>`
  ).join('');
  const warn = d.enabled ? '' : `
    <div class="alert r" style="margin-bottom:12px"><span>🔒</span><div>
      <b>Terminal đang tắt</b>
      <div class="hint" style="margin-top:4px">${esc(d.error || '')}</div>
      <div class="hint" style="margin-top:4px">Bật <span class="mono">local_only</span> trong
        <span class="mono">configs/panel_security.json</span>, hoặc bật tường minh
        <span class="mono">allow_terminal</span> nếu panel phơi ra ngoài internet.</div>
      <button class="btn" style="margin-top:8px" onclick="termEnable()">🔓 Bật terminal cho panel này</button>
    </div></div>`;
  setTimeout(termPaint, 20);
  return `
    ${warn}
    <div class="card" style="margin-bottom:12px">
      <div class="row" style="flex-wrap:wrap;gap:6px">
        <span class="pill mono" title="${esc(d.cwd||'')}">📁 ${esc((d.cwd||'').split('/').slice(-1)[0]||'—')}</span>
        <span class="pill"><span class="dot ${d.enabled?'g':'r'}"></span> ${d.enabled?'sẵn sàng':'đang tắt'}</span>
        <span class="pill mono">${esc(d.shell||'')}</span>
        <div class="spacer" style="flex:1"></div>
        <label class="row" style="gap:6px;font-size:12px">⏱ <input class="i" id="tto" type="number"
          value="30" min="1" max="120" style="max-width:80px"></label>
        <button class="btn" onclick="termClear()">🗑 Xoá màn hình</button>
      </div>
      <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px">${quick}</div>
    </div>
    <div class="term" id="tbox" onclick="var i=document.getElementById('tin');if(i)i.focus()"></div>
    <div class="term-in">
      <span class="pmt">$</span>
      <input class="i mono" id="tin" autocomplete="off" spellcheck="false"
        placeholder="Nhập lệnh rồi Enter… (↑↓ lịch sử · Ctrl+L xoá)" style="flex:1">
      <button class="btn pri" onclick="termRun()">Chạy ⏎</button>
      <button class="btn" onclick="termSpawn()" title="Chạy nền, không chờ">▶ Nền</button>
    </div>`;
};
function termPaint() {
  const b = $('#tbox'); if (!b) return;
  b.innerHTML = (S.termLines || []).join('') ||
    '<span class="dim">Terminal sẵn sàng. Gõ lệnh bên dưới rồi Enter.\n' +
    'Ví dụ: git pull --ff-only · python main.py · ps aux | grep main.py</span>';
  b.scrollTop = b.scrollHeight;
  const i = $('#tin');
  if (i) {
    if (!i._wired) { i._wired = true; i.addEventListener('keydown', termKey); }
    i.focus();
  }
}
function termPush(html) {
  S.termLines = S.termLines || [];
  S.termLines.push(html);
  if (S.termLines.length > 500) S.termLines.shift();
  const b = $('#tbox');
  if (b) { b.innerHTML = S.termLines.join(''); b.scrollTop = b.scrollHeight; }
}
function termClear() { S.termLines = []; termPaint(); }
function termKey(e) {
  const hist = S.termHist || [];
  if (e.key === 'Enter') { e.preventDefault(); termRun(); return; }
  if (e.key === 'l' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); termClear(); return; }
  if (e.key === 'ArrowUp' && hist.length) {
    e.preventDefault();
    S.termIdx = Math.min((S.termIdx == null ? -1 : S.termIdx) + 1, hist.length - 1);
    e.target.value = hist[S.termIdx] || '';
  } else if (e.key === 'ArrowDown' && hist.length) {
    e.preventDefault();
    S.termIdx = Math.max((S.termIdx == null ? 0 : S.termIdx) - 1, -1);
    e.target.value = S.termIdx < 0 ? '' : (hist[S.termIdx] || '');
  }
}
async function termRun(cmd) {
  const inp = $('#tin');
  const c = String(cmd != null ? cmd : (inp ? inp.value : '')).trim();
  if (!c) return;
  if (c === '__restart__') return termSpawn(c);
  S.termHist = [c, ...(S.termHist || []).filter(x => x !== c)].slice(0, 60);
  S.termIdx = -1;
  if (inp && cmd == null) inp.value = '';
  termPush(`<div class="cmd">$ ${esc(c)}</div>`);
  if (inp) inp.disabled = true;
  let to = 30;
  try { to = Number($('#tto')?.value || 30); } catch (e) {}
  try {
    const d = await api('/api/v4/terminal/run',
      { method: 'POST', body: { cmd: c, timeout: to } });
    const body = [d.out, d.err].filter(Boolean).join('\n');
    termPush(`<div class="${d.code === 0 ? 'ok' : 'bad'}">` +
      `${esc(body || '(không có output)')}\n[exit ${d.code} · ${d.ms} ms]</div>`);
  } catch (e) {
    termPush(`<div class="bad">${esc(e.message)}</div>`);
  }
  if (inp) { inp.disabled = false; inp.focus(); }
}
async function termSpawn(cmd) {
  const inp = $('#tin');
  const c = String(cmd != null ? cmd : (inp ? inp.value : '')).trim();
  if (!c) return;
  if (inp && cmd == null) inp.value = '';
  termPush(`<div class="cmd">$ ${esc(c)} <span class="dim">(chạy nền)</span></div>`);
  try {
    const d = await api('/api/v4/terminal/spawn', { method: 'POST', body: { cmd: c } });
    termPush(`<div class="ok">đã chạy nền · pid ${d.pid}` +
      (c === '__restart__' ? ' — bot đang khởi động lại, đợi ~5s rồi bấm ⟳ Làm mới' : '') +
      ` · <button class="btn" style="font-size:11px;padding:2px 8px" onclick="termTail(${d.pid})">Xem log</button></div>`);
  } catch (e) { termPush(`<div class="bad">${esc(e.message)}</div>`); }
}
async function termTail(pid) {
  try {
    const d = await api(`/api/v4/terminal/log?pid=${pid}&lines=120`);
    termPush(`<div class="dim">── log pid ${pid} (${d.alive ? 'đang chạy' : 'đã dừng'}) ──</div>` +
      `<div>${esc(d.text || '(rỗng)')}</div>`);
  } catch (e) { termPush(`<div class="bad">${esc(e.message)}</div>`); }
}
function termQuick(i) {
  const q = ((S.termState || {}).quick || [])[i];
  if (!q) return;
  if (q.cmd === '__restart__') return termSpawn('__restart__');
  const inp = $('#tin'); if (inp) inp.value = q.cmd;
  termRun();
}
async function termEnable() {
  try {
    await api('/api/v4/terminal/config', { method: 'POST', body: { allow_terminal: true } });
    toast('✅ Đã bật terminal', 'g');
    draw();
  } catch (e) { toast('🔴 ' + e.message, 'err'); }
}

        <table><tbody>${Object.entries(caches).map(([k,v]) =>
          `<tr><td class="mono">${esc(k)}</td><td class="num">${num(v.files)} file</td><td class="num">${v.size_mb} MB</td></tr>`
        ).join('') || '<tr><td class="hint">Không có dữ liệu.</td></tr>'}</tbody></table></div>
    </div>

      <button class="btn" onclick="go('mybot')">🤖 Bot con</button>

};

async function refresh() {
  try { S.ov = await api('/api/v4/overview'); } catch (e) { /* hiện ở badge RTT */ }
  const b = (S.ov||{}).bot || {};
  if (b.name) { $('#bn').textContent = b.name; $('#wn').textContent = S.user || 'admin'; }
  $('#wr').textContent = (S.role || '') + ' · ' + (b.uptime || '—');
  $('#av').textContent = (S.user || 'A')[0].toUpperCase();
  $('#live').innerHTML = `<span class="dot ${b.listening?'g':'r'}"></span> ${b.listening?'bot trực tuyến':'bot ngoại tuyến'}`;
  $('#stamp').textContent = 'v4 · ' + new Date().toLocaleTimeString('vi-VN');
  // badge cảnh báo trên sidebar
  const l = (S.ov||{}).latency || {};
  const nb = $('[data-b="latency"]');
  if (nb) {
    const slow = l.slow_count || 0;
    nb.textContent = slow ? slow : '';
    nb.className = 'bdg ' + (slow > 5 ? 'd' : slow ? 'w' : '');
  }
  const cb = $('[data-b="cache"]');
  const c = (S.ov||{}).cache || {};
  if (cb) { cb.textContent = c.total_mb ? c.total_mb + 'M' : ''; cb.className = 'bdg'; }
  // Lệnh: hiện SỐ ĐANG BẬT (kèm số tắt nếu có) — trước đây chỉ hiện tổng
  const kmb = $('[data-b="cmds"]');
  if (kmb) {
    const on = b.cmd_enabled, off = b.cmd_disabled || 0;
    if (typeof on === 'number') {
      kmb.textContent = off ? `${on} bật · ${off} tắt` : `${on} bật`;
      kmb.className = 'bdg ' + (off ? 'w' : '');
    } else { kmb.textContent = ''; kmb.className = 'bdg'; }
  }
  // Đếm nhóm THẬT (1 lần/phiên; server đã cache nên rất nhẹ)
  if (S.groupsN == null) {
    try { S.groupsN = ((await api('/api/v4/groups')).groups || []).length; } catch (e) {}
    const gb = $('[data-b="groups"]');
    if (gb) { gb.textContent = S.groupsN ?? ''; gb.className = 'bdg'; }
  }
}

/* ── WELCOME STUDIO ───────────────────────────────────────────── */
let _wTimer = null, _wMemTimer = null;
/* Mọi tham số card đều TỰ ĐỌC: tên nhóm + số thành viên từ nhóm đang chọn,
   tên/avatar thành viên từ THÀNH VIÊN THẬT chọn trong dropdown, avatar Zalo
   của thành viên khi bot gửi thật. Người dùng không gõ tay tham số nào. */
function wGroupOption() {
  const sel = $('#w-grp');
  return sel && sel.selectedIndex >= 0 ? sel.options[sel.selectedIndex] : null;
}
function wMemberOption() {
  const sel = $('#w-mem');
  return sel && sel.selectedIndex > 0 ? sel.options[sel.selectedIndex] : null;
}
function wParams(withToken) {
  const p = new URLSearchParams();
  const g = wGroupOption(), m = wMemberOption();
  const av = $('#w-avst')?.dataset.av;
  p.set('name', (m && m.value ? m.dataset.n : 'Thành viên'));
  p.set('group', (g && g.dataset.n) || '');
  if (m && m.dataset.g !== undefined && m.dataset.g !== '') p.set('gender', m.dataset.g);
  if (g && g.dataset.t) p.set('total', g.dataset.t);
  p.set('mode', S.wcMode || 'gif');
  if ($('#w-leave')?.value) p.set('leave', '1');
  if (av) p.set('avatar', av);
  else if (m && m.dataset.av) p.set('avatar', m.dataset.av);
  if (withToken) p.set('token', S.token);
  return p;
}
/* Đọc THÀNH VIÊN THẬT của nhóm (tên + avatar từ Zalo) — 1 call/nhóm,
   server trả cache trước rồi nạp ở nền nên panel không bị treo. */
function wLoadMembers(tid) {
  if (_wMemTimer) { clearTimeout(_wMemTimer); _wMemTimer = null; }
  const st = $('#w-memst'), sel = $('#w-mem');
  if (!tid || !sel) return;
  let tries = 0;
  const run = async () => {
    try {
      const d = await api('/api/v4/group/members?tid=' + encodeURIComponent(tid));
      const ms = d.members || [];
      sel.innerHTML = '<option value="">— tự đọc khi có sự kiện —</option>'
        + ms.map((m, i) => `<option value="${esc(m.id)}" data-n="${esc(m.name)}"
            data-av="${esc(m.avatar || '')}">${esc(m.name)}</option>`).join('');
      if (st) st.textContent = ms.length
        ? `Đã đọc ${ms.length} thành viên thật từ Zalo.`
        : 'Đang đọc thành viên từ Zalo…';
      if (!ms.length && ++tries < 6) _wMemTimer = setTimeout(run, 1500);
    } catch (e) { if (st) st.textContent = 'Không đọc được thành viên: ' + e.message; }
  };
  run();
}
function wMemberPicked() {
  const m = wMemberOption();
  const el = $('#w-a-name');
  if (el) el.textContent = m && m.value ? m.dataset.n : '—';
  wPreview(1);
}
function wGroupChanged() {
  const g = wGroupOption();
  if ($('#w-a-gname')) $('#w-a-gname').textContent = (g && g.dataset.n) || '—';
  if ($('#w-a-gtotal')) $('#w-a-gtotal').textContent = (g && g.dataset.t) || '—';
  if ($('#w-a-name')) $('#w-a-name').textContent = '—';
  wLoadMembers(g && g.value);
  wState();
  wPreview(1);
}
function wPreview(now) {
  if (_wTimer) clearTimeout(_wTimer);
  const run = () => {
    const img = $('#w-prev'); if (!img) return;
    img.src = apiUrl('/api/v4/welcome/preview?' + wParams(true).toString() + '&_=' + Date.now());
  };
  if (now) run(); else _wTimer = setTimeout(run, 400);
}
function wUpload(inp) {
  const f = inp.files && inp.files[0];
  if (!f) return;
  if (f.size > 2500000) return toast('Ảnh quá lớn (tối đa 2.5MB)', 'r');
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = await api('/api/v4/welcome/avatar', { method: 'POST', body: { data: r.result } });
      const st = $('#w-avst');
      st.dataset.av = d.avatar;
      st.textContent = 'Đang dùng avatar tải lên: ' + d.avatar;
      toast('Đã nạp avatar', 'g'); wPreview(1);
    } catch (e) { toast(e.message, 'r'); }
  };
  r.readAsDataURL(f);
}
function wClearAv() {
  const st = $('#w-avst');
  if (st) { delete st.dataset.av; st.textContent = 'Chưa chọn — khi bot gửi thật, card dùng avatar Zalo thật của thành viên.'; }
  const i = $('#w-av'); if (i) i.value = '';
  wPreview(1);
}
function wRandom() {
  // Ngẫu nhiên CHỌN THÀNH VIÊN THẬT (không bịa tên) + sự kiện ngẫu nhiên.
  const sel = $('#w-mem');
  if (sel && sel.options.length > 1) {
    sel.selectedIndex = 1 + Math.floor(Math.random() * (sel.options.length - 1));
  }
  if ($('#w-leave')) $('#w-leave').value = Math.random() < 0.5 ? '1' : '';
  wMemberPicked();
}
/* Trạng thái welcome của nhóm đang chọn — để bạn KIỂM CHỨNG ngay trên panel
   thay vì phải gõ lệnh trong chat rồi đoán. */
async function wState() {
  const sel = $('#w-grp'), el = $('#w-state'), gel = $('#w-gstate');
  if (!el) return;
  if (!sel || !sel.value) { el.innerHTML = '<span class="dot a"></span> chưa có nhóm'; return; }

    S.wcMode = d.mode || 'gif';
    el.innerHTML = `<span class="dot ${d.enabled ? 'g' : 'r'}"></span> `
      + (d.enabled ? 'đang BẬT card' : 'đang TẮT card')

    if (gel) gel.innerHTML = `<span class="dot ${d.enabled_all ? 'g' : 'r'}"></span> `
      + (d.enabled_all ? 'toàn cục: BẬT' : 'toàn cục: TẮT');
    const am = $('#w-a-mode');
    if (am) am.textContent = (d.mode === 'image' ? '🖼️ Ảnh tĩnh' : '🎬 GIF · mẫu ngẫu nhiên');

async function wSend() {
  const sel = $('#w-grp');

  const opt = sel.options[sel.selectedIndex], mem = wMemberOption();

const PAL = [
  ['Dashboard','▦', () => go('dash')],
  ['Độ trễ lệnh','⚡', () => go('latency')],
  ['Cache & dọn ngay','🗄', () => go('cache')],

  ['Log trực tiếp','≡', () => go('log')],
  ['Hệ thống','⚙', () => go('sys')],
  ['Dọn cache ngay','🧹', gcNow],
  ['Xoá số liệu độ trễ','🗑', resetStats],
  ['Đổi sáng/tối','◐', toggleTheme],
  ['Chẩn đoán panel','🩺', selfCheck],

  ['Đăng xuất','⏻', () => logout()],
];
let palIdx = 0, palHits = [];
function palOpen() { $('#pal').classList.add('on'); $('#pq').value=''; palRender(''); $('#pq').focus(); }
function palClose() { $('#pal').classList.remove('on'); }
function palRender(q) {
  q = (q||'').toLowerCase();
  palHits = PAL.filter(p => !q || p[0].toLowerCase().includes(q));
  palIdx = 0;
  $('#pl').innerHTML = palHits.map((p,i) =>
    `<div class="pi ${i===0?'sel':''}" data-i="${i}"><span class="ic">${p[1]}</span>
      <span>${esc(p[0])}</span><span class="ds">Enter</span></div>`).join('')
    || '<div class="pi">Không có kết quả</div>';
  $$('#pl .pi[data-i]').forEach(el => el.onclick = () => { const p = palHits[+el.dataset.i]; if (p) { palClose(); p[2](); } });
}
$('#pq').addEventListener('input', e => palRender(e.target.value));
$('#pq').addEventListener('keydown', e => {
  if (e.key === 'Escape') return palClose();
  if (e.key === 'Enter') { const p = palHits[palIdx]; if (p) { palClose(); p[2](); } return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    palIdx = (palIdx + (e.key === 'ArrowDown' ? 1 : -1) + palHits.length) % palHits.length;
    $$('#pl .pi[data-i]').forEach((el,i) => el.classList.toggle('sel', i === palIdx));
  }
});
$('#pal').addEventListener('click', e => { if (e.target.id === 'pal') palClose(); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); palOpen(); }
  if (e.key === 'Escape') palClose();
});
